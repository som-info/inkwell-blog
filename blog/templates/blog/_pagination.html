{% if is_paginated %}
<nav class="pagination" aria-label="Pagination">
  {% if page_obj.has_previous %}
    <a href="?{% if query %}q={{ query|urlencode }}&amp;{% endif %}page={{ page_obj.previous_page_number }}" rel="prev">← Newer</a>
  {% else %}<span class="disabled">← Newer</span>{% endif %}
  <span class="current">Page {{ page_obj.number }} of {{ paginator.num_pages }}</span>
  {% if page_obj.has_next %}
    <a href="?{% if query %}q={{ query|urlencode }}&amp;{% endif %}page={{ page_obj.next_page_number }}" rel="next">Older →</a>
  {% else %}<span class="disabled">Older →</span>{% endif %}
</nav>
{% endif %}
